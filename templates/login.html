<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERLI Monitor — Вход</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #1a1a2e;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .box { background: #fff; border-radius: 14px; padding: 38px 40px; width: 340px;
           box-shadow: 0 8px 40px rgba(0,0,0,.4); }
    h1 { font-size: 19px; margin-bottom: 6px; color: #1a1a2e; }
    p  { font-size: 13px; color: #6b7280; margin-bottom: 22px; }
    input[type=password] { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db;
           border-radius: 8px; font-size: 14px; margin-bottom: 14px; outline: none; }
    input[type=password]:focus { border-color: #2563eb; }
    button { width: 100%; padding: 10px; background: #2563eb; color: #fff; border: none;
             border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .err { color: #dc2626; font-size: 13px; margin-bottom: 12px; font-weight: 600; }
  </style>
</head>
<body>
  <form class="box" method="post">
    <h1>ERLI Monitor</h1>
    <p>Введите пароль для входа</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <input type="password" name="password" placeholder="Пароль" autofocus>
    <button type="submit">Войти</button>
  </form>
</body>
</html>
